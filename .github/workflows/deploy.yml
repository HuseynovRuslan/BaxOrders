# Every push to main is checked here and, once the checks pass, goes live on order.qrlog.az (the owner, 30 October
# 2026). The VPS pulls it: GitHub's runners cannot reach its SSH port, so deploy/scripts/pull-deploy.sh (run by cron
# on the server, outside any release) asks GitHub every two minutes for a new main whose "frontend" and "backend"
# checks passed, and deploys it. Two exceptions wait for the owner: a commit that changes a migration (production
# migrates by hand), and QRLog's clock-in peaks (07:30-09:30, 17:00-19:00 Baku). The last job here waits until the
# site runs the commit, and says which exception held it back.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/bax-orders-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/bax-orders-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --testTimeout=20000

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BAXORDERS_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The two test projects, which cover what is deployed (the API image builds src/ only). The whole solution would
      # also restore tools/BaxOrders.DataTransfer, whose Microsoft.Data.SqlClient brings a vulnerable
      # System.Security.Cryptography.Pkcs that the audit turns into an error; that tool never reaches the server.
      - run: dotnet test tests/BaxOrders.UnitTests -nologo
      - run: dotnet test tests/BaxOrders.IntegrationTests -nologo

  live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://order.qrlog.az
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait until order.qrlog.az runs this commit
        run: |
          want="${GITHUB_SHA:0:7}"
          version() { curl -fsS --max-time 10 https://order.qrlog.az/api/v1/version 2>/dev/null | jq -r .commit 2>/dev/null || true; }
          migrations() { git diff --name-only "$1" "$GITHUB_SHA" -- '*/Persistence/Migrations/*' 2>/dev/null | head -5; }
          running="$(version)"
          if [ -n "$running" ] && [ "$running" != unknown ] && git cat-file -e "$running^{commit}" 2>/dev/null; then
            changed="$(migrations "$running")"
            if [ -n "$changed" ]; then
              echo "::error::This push changes a migration ($(echo $changed | tr ' ' ',')). Production migrates by hand, so it is not deployed automatically; the owner applies the migration and deploys it."
              exit 1
            fi
          fi
          for i in $(seq 1 100); do
            running="$(version)"
            if [ "$running" = "$want" ]; then echo "order.qrlog.az runs $want"; exit 0; fi
            sleep 15
          done
          baku="$(TZ=Asia/Baku date +%H%M)"; baku=$((10#$baku))
          if { [ "$baku" -ge 730 ] && [ "$baku" -lt 930 ]; } || { [ "$baku" -ge 1700 ] && [ "$baku" -lt 1900 ]; }; then
            echo "::notice::QRLog clock-in peak in Baku: the server deploys $want after it (09:30 or 19:00)."
            exit 0
          fi
          echo "::error::order.qrlog.az still runs ${running:-nothing readable}, not $want. Either a newer push replaced it, or the server's deploy failed (~deploy/.baxorders-pull-deploy/log)."
          exit 1
