# executive.qrlog.az behind Caddy: the static prototype, its figures in /data/ (written by the import service),
# and the import service's three ways in — /api/import, /api/undo and /api/catalog — on the private executive_internal network.
# The import service's steps need no key (owner, 2026-10-28): at most 30 a minute from one address, so nobody can
# flood it. Caddy in front sets X-Forwarded-For to the visitor's address.
limit_req_zone $http_x_forwarded_for zone=executive_api:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, so nginx starts even while the import service is down and finds it when an upload comes.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ~ ^/api/(import|undo|catalog)$ {
        client_max_body_size 25m;
        client_body_timeout 60s;
        proxy_read_timeout 180s;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        set $import_service executive-import:8080;
        limit_req zone=executive_api burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$import_service;
    }
    location /api/ {
        return 404;
    }

    location /data/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
    }
}
